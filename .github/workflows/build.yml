name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, in push order, so an older build can never finish
# last and replace a newer release.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Restore signing key
        id: key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/mytv.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set: building with a throwaway key and not publishing a release (auto-updates need a stable key)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        env:
          # Optional: add these as repository secrets to enable Trakt.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_HOUSEHOLD: ${{ secrets.SYNC_HOUSEHOLD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MyTV.apk
          # Read by the app's auto-updater.
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\", \"commit\": \"${GITHUB_SHA::7}\"}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: MyTV-apk
          path: MyTV.apk
      # Two channels:
      # - "latest": every build (test channel), marked as a pre-release;
      # - "stable": only builds you release with the "Release to TVs" workflow
      #   (Actions tab). TVs follow stable unless set to test builds in MyTV settings,
      #   and https://github.com/<owner>/<repo>/releases/latest/download/MyTV.apk
      #   (the install link) always points at stable.
      - name: Publish to the test channel
        if: steps.key.outputs.present == 'true' && (github.ref_name == 'claude/chromecast-app-launcher-v0ltwe' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt and braces: never replace a newer build with an older one.
          current=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/version.json" | sed -n 's/.*"versionCode": *\([0-9]*\).*/\1/p')
          if [ -n "$current" ] && [ "$current" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "Test channel already has newer build $current; not publishing $GITHUB_RUN_NUMBER."
            exit 0
          fi
          notes="Test build from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
          # The first time, also start the stable channel with this build, so the
          # install link and older TVs keep working.
          if ! gh release view stable >/dev/null 2>&1; then
            gh release create stable MyTV.apk version.json --target "$GITHUB_SHA" --title "MyTV" --notes "Stable release (1.0.${GITHUB_RUN_NUMBER})." --latest
          fi
          # Update in place (never delete), so links keep working even if this step fails halfway.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MyTV.apk version.json --clobber
            gh release edit latest --notes "$notes" --prerelease
          else
            gh release create latest MyTV.apk version.json --target "$GITHUB_SHA" --title "MyTV (test build)" --notes "$notes" --prerelease
          fi
